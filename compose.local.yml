# Local-only overlay. Keep compose.yml usable for NCP Cloud DB deployment.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: video_rag
      POSTGRES_USER: video_rag
      POSTGRES_PASSWORD: video_rag_local
    volumes:
      - video-rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_rag -d video_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    environment:
      DATABASE_URL: postgresql://video_rag:video_rag_local@postgres:5432/video_rag
    depends_on:
      postgres:
        condition: service_healthy

  chat:
    environment:
      DATABASE_URL: postgresql://video_rag:video_rag_local@postgres:5432/video_rag

  worker:
    environment:
      DATABASE_URL: postgresql://video_rag:video_rag_local@postgres:5432/video_rag

volumes:
  video-rag-postgres-data:
