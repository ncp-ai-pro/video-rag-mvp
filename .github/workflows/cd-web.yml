name: CD Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "Dockerfile.web"
      - "deploy/nginx/**"
      - "compose.web.yml"
      - ".github/workflows/cd-web.yml"

permissions:
  contents: read

concurrency:
  group: cd-web
  cancel-in-progress: false

env:
  WEB_IMAGE_NAME: kimgt2828/yt-rag-web
  NCP_SOURCEDEPLOY_API_ORIGIN: https://vpcsourcedeploy.apigw.ntruss.com

jobs:
  deploy-web:
    name: Build, push, and trigger web deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build React app
        working-directory: web
        run: npm run build

      - name: Resolve image tags
        id: tags
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${WEB_IMAGE_NAME}:${short_sha}" >> "$GITHUB_OUTPUT"
          echo "stable_tag=${WEB_IMAGE_NAME}:v1" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.web \
            --build-arg VITE_API_BASE=/api \
            --build-arg VITE_CHAT_BASE=/api \
            -t "${{ steps.tags.outputs.stable_tag }}" \
            -t "${{ steps.tags.outputs.version_tag }}" \
            --push .

      - name: Trigger NCP SourceDeploy web scenario
        env:
          NCP_ACCESS_KEY: ${{ secrets.NCP_ACCESS_KEY }}
          NCP_SECRET_KEY: ${{ secrets.NCP_SECRET_KEY }}
          NCP_SOURCEDEPLOY_PROJECT_ID: ${{ secrets.NCP_SOURCEDEPLOY_PROJECT_ID }}
          NCP_SOURCEDEPLOY_STAGE_ID: ${{ secrets.NCP_SOURCEDEPLOY_STAGE_ID }}
          NCP_SOURCEDEPLOY_WEB_SCENARIO_ID: ${{ secrets.NCP_SOURCEDEPLOY_WEB_SCENARIO_ID }}
        run: |
          test -n "${NCP_ACCESS_KEY}"
          test -n "${NCP_SECRET_KEY}"
          test -n "${NCP_SOURCEDEPLOY_PROJECT_ID}"
          test -n "${NCP_SOURCEDEPLOY_STAGE_ID}"
          test -n "${NCP_SOURCEDEPLOY_WEB_SCENARIO_ID}"

          python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          method = "POST"
          origin = os.environ["NCP_SOURCEDEPLOY_API_ORIGIN"].rstrip("/")
          project_id = os.environ["NCP_SOURCEDEPLOY_PROJECT_ID"]
          stage_id = os.environ["NCP_SOURCEDEPLOY_STAGE_ID"]
          scenario_id = os.environ["NCP_SOURCEDEPLOY_WEB_SCENARIO_ID"]
          access_key = os.environ["NCP_ACCESS_KEY"]
          secret_key = os.environ["NCP_SECRET_KEY"]

          uri = f"/api/v1/project/{project_id}/stage/{stage_id}/scenario/{scenario_id}/deploy"
          timestamp = str(int(time.time() * 1000))
          message = f"{method} {uri}\n{timestamp}\n{access_key}"
          signature = base64.b64encode(
              hmac.new(secret_key.encode("utf-8"), message.encode("utf-8"), hashlib.sha256).digest()
          ).decode("utf-8")

          request = urllib.request.Request(
              f"{origin}{uri}",
              data=b"",
              method=method,
              headers={
                  "Content-Type": "application/json",
                  "x-ncp-apigw-timestamp": timestamp,
                  "x-ncp-iam-access-key": access_key,
                  "x-ncp-apigw-signature-v2": signature,
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode("utf-8")
                  print(f"SourceDeploy status: {response.status}")
                  print(body)
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", "replace")
              print(f"SourceDeploy failed: HTTP {error.code}", file=sys.stderr)
              print(body, file=sys.stderr)
              raise
          PY

      - name: Deployment summary
        run: |
          {
            echo "### Web deployment triggered"
            echo ""
            echo "- Stable tag: \`${{ steps.tags.outputs.stable_tag }}\`"
            echo "- Trace tag: \`${{ steps.tags.outputs.version_tag }}\`"
            echo "- SourceDeploy scenario id: \`${{ vars.NCP_SOURCEDEPLOY_WEB_SCENARIO_ID }}\`"
            echo ""
            echo "This workflow does not update SourceDeploy Object Storage artifacts or \`web/.env\`."
            echo "SourceDeploy uses the artifact configured in the scenario."
          } >> "$GITHUB_STEP_SUMMARY"
