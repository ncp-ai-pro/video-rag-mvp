apiVersion: v1
kind: ConfigMap
metadata:
  name: yt-rag-app-config
  namespace: video-rag
data:
  EMBEDDING_PROVIDER: "clova"
  CHAT_PROVIDER: "clova"
  CLOVA_MODEL: "HCX-DASH-002"
  CHAT_HISTORY_TURNS: "3"

  REDIS_CHAT_CACHE_TTL_SECONDS: "3600"

  ANALYSIS_QUEUE_PROVIDER: "rabbitmq"
  WORKER_QUEUE_MODE: "rabbitmq"
  WORKER_PREFETCH_COUNT: "1"
  WORKER_OUTBOX_PUBLISH_INTERVAL_SECONDS: "30"

  CLOVA_SPEECH_LANGUAGE: "ko-KR"

  NCP_OBJECT_STORAGE_ENDPOINT: "https://kr.object.private.ncloudstorage.com"
  NCP_OBJECT_STORAGE_REGION: "kr-standard"
  NCP_OBJECT_STORAGE_BUCKET: "yt-storage"
  OBJECT_STORAGE_ARTIFACT_PREFIX: "videos"
  OBJECT_STORAGE_STT_INPUT_PREFIX: "clova-speech/input"
  OBJECT_STORAGE_STT_RESULT_PREFIX: "clova-speech/result"

  YTDLP_BIN: "yt-dlp"
  YTDLP_SLEEP_REQUESTS_SECONDS: "5"
  YTDLP_SLEEP_INTERVAL_SECONDS: "5"
  YTDLP_MAX_SLEEP_INTERVAL_SECONDS: "10"
  YTDLP_RATE_LIMIT_RETRY_DELAY_SECONDS: "3600"
  WORKER_PARAGRAPH_MAX_SECONDS: "75"
  WORKER_PARAGRAPH_MAX_CHARS: "1800"
  WORKER_RAG_CHUNK_MAX_SECONDS: "25"
  WORKER_RAG_CHUNK_MAX_CHARS: "700"
  WORKER_EMBEDDING_MIN_INTERVAL_SECONDS: "1.5"
  WORKER_EMBEDDING_MAX_RETRIES: "5"
  WORKER_EMBEDDING_BACKOFF_BASE_SECONDS: "2"

  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_DOMAIN: ".cs542.sth.ai.kr"
  SESSION_MAX_AGE_SECONDS: "2592000"
  CORS_ALLOW_ORIGINS: "https://www.cs542.sth.ai.kr,http://www.cs542.sth.ai.kr"
