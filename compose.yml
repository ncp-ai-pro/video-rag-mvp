name: video-rag-mvp

x-app-build: &app-build
  context: .
  args:
    # Empty is correct for local all-in-one API serving.
    # Nginx production builds can set VITE_API_BASE=/api if the UI is served by Web.
    VITE_API_BASE: ${VITE_API_BASE:-}
    VITE_CHAT_BASE: ${VITE_CHAT_BASE:-}

services:
  api:
    build: *app-build
    image: video-rag-mvp:latest
    env_file:
      - path: .env
        required: false
      # 로컬 개인 설정은 Git에 포함하지 않는 .env.local에 둔다.
      # 같은 키가 있으면 뒤의 .env.local 값이 .env 값을 덮어쓴다.
      - path: .env.local
        required: false
    environment:
      DATABASE_PATH: /app/data/video_rag.db
    ports:
      - "8000:8000"
    volumes:
      - video-rag-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat:
    build: *app-build
    image: video-rag-mvp:latest
    command: ["uvicorn", "app.chat_main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_PATH: /app/data/video_rag.db
    ports:
      - "8001:8000"
    volumes:
      - video-rag-data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: *app-build
    image: video-rag-mvp:latest
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_PATH: /app/data/video_rag.db
    volumes:
      - video-rag-data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  video-rag-data:
