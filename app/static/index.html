<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video RAG</title>
  <style>
    :root { --ink:#172033; --muted:#697386; --line:#dfe3eb; --page:#f5f6f8; --card:#fff; --accent:#1265d6; --soft:#eaf2ff; --danger:#b42318; }
    * { box-sizing:border-box; } body { margin:0; background:var(--page); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:var(--card); border-bottom:1px solid var(--line); }
    h1 { font-size:19px; margin:0; letter-spacing:-.02em; } h2 { font-size:15px; margin:0; } .status { color:var(--muted); font-size:13px; }
    main { max-width:1440px; margin:0 auto; padding:22px 28px; display:grid; grid-template-columns:250px minmax(340px,1fr) minmax(330px,1fr); gap:16px; }
    section { background:var(--card); border:1px solid var(--line); border-radius:10px; min-height:200px; } .panel-title { padding:16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    .panel-body { padding:16px; } form { display:flex; gap:8px; } input, textarea { width:100%; border:1px solid #c7ced9; border-radius:7px; padding:9px 10px; font:inherit; color:var(--ink); } textarea { min-height:72px; resize:vertical; }
    button { border:0; border-radius:7px; padding:9px 12px; background:var(--accent); color:#fff; font:inherit; font-weight:650; cursor:pointer; white-space:nowrap; } button.secondary { background:#eef1f5; color:#253247; } button:disabled { opacity:.55; cursor:default; }
    .channel, .video, .result { width:100%; text-align:left; padding:12px 16px; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--ink); font-weight:400; } .channel:hover, .video:hover, .result:hover { background:#f8fbff; }
    .selected { background:var(--soft); box-shadow:inset 3px 0 0 var(--accent); } .name { display:block; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .meta, small { color:var(--muted); font-size:12px; }
    .empty { color:var(--muted); padding:20px 16px; font-size:13px; } .controls { display:flex; gap:8px; margin-top:10px; } .block { margin-bottom:20px; }
    .tag { display:inline-block; border-radius:999px; padding:2px 7px; font-size:11px; font-weight:650; background:#eef1f5; color:#556070; } .tag.ready { background:#e9f7ef; color:#19703b; } .tag.failed { background:#fff0ef; color:var(--danger); }
    .video-header { padding:16px; border-bottom:1px solid var(--line); } .video-header a { color:var(--accent); text-decoration:none; font-size:13px; } .analysis-note { font-size:13px; color:var(--muted); margin:10px 0; }
    .result { display:block; text-decoration:none; } .score { float:right; color:var(--muted); font-size:12px; } .evidence-list { margin-top:8px; } .evidence-title { margin:0 0 6px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .evidence { display:block; border:1px solid var(--line); border-radius:12px; padding:9px 11px; margin-top:7px; background:#fff; text-decoration:none; color:var(--ink); transition:background .15s,border-color .15s; } .evidence:hover { background:#f8fafc; border-color:#c9d1de; } .evidence.primary { box-shadow:inset 2px 0 0 rgba(23,32,51,.32); } .evidence-head { display:flex; align-items:center; gap:6px; min-width:0; } .evidence-time { display:inline-flex; align-items:center; border-radius:999px; padding:1px 7px; background:#eef1f5; color:#556070; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; } .evidence .badge { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:1px 6px; color:#4b5563; font-size:10px; font-weight:650; } .evidence-source { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:12px; } .evidence-quote { display:block; margin-top:6px; color:#4a5568; font-size:12px; line-height:1.55; } .highlight { font-weight:700; color:var(--ink); background:linear-gradient(transparent 58%, #fff0b3 0); }
    .chat-log { max-height:440px; overflow-y:auto; } .msg { padding:9px 12px; border-radius:10px; margin-bottom:10px; white-space:pre-wrap; } .msg.user { background:var(--soft); margin-left:28px; } .msg.assistant { background:#f3f5f8; margin-right:28px; }
    .segmented { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff; } .segmented button { border-radius:0; background:#fff; color:var(--muted); padding:5px 10px; font-size:12px; font-weight:600; } .segmented button.active { background:var(--ink); color:#fff; }
    #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#172033; color:#fff; padding:10px 14px; border-radius:7px; font-size:13px; display:none; max-width:90vw; }
    @media (max-width: 980px) { main { grid-template-columns:230px 1fr; } #chat-panel { grid-column:1 / -1; } }
    @media (max-width: 650px) { header { padding:0 16px; } main { display:block; padding:12px; } section { margin-bottom:12px; } }
  </style>
</head>
<body>
  <header><h1>Video RAG</h1><div><span class="status" id="workspace-code">작업공간 확인 중</span> <button id="connect-workspace" class="secondary">기존 작업공간 연결</button> <button id="new-workspace" class="secondary">새 작업공간</button> <span class="status" id="server-status">서버 확인 중</span></div></header>
  <main>
    <section aria-labelledby="channels-title">
      <div class="panel-title"><h2 id="channels-title">채널</h2></div>
      <div class="panel-body">
        <form id="channel-form"><input id="channel-url" type="url" placeholder="YouTube 채널 URL" required aria-label="YouTube 채널 URL"><button>등록</button></form>
        <div class="controls"><button id="scan-button" class="secondary" disabled>새 영상 탐색</button></div>
      </div>
      <div id="channels"><p class="empty">등록된 채널이 없습니다.</p></div>
    </section>

    <section aria-labelledby="videos-title">
      <div class="panel-title"><h2 id="videos-title">영상 카탈로그</h2><span class="meta" id="video-count"></span></div>
      <div id="videos"><p class="empty">채널을 선택하면 영상 메타데이터가 표시됩니다.</p></div>
    </section>

    <section id="chat-panel" aria-labelledby="chat-title">
      <div class="panel-title"><h2 id="chat-title">분석과 질문</h2></div>
      <div class="panel-body">
        <div id="selected-video"><p class="empty">왼쪽에서 채널을 선택하고, 가운데에서 분석할 영상을 고르세요.</p></div>
        <div class="block">
          <label for="recommendation-query" class="name">메타데이터 추천</label>
          <p class="analysis-note">제목과 영상 설명의 embedding 유사도만 사용합니다.</p>
          <form id="recommendation-form"><input id="recommendation-query" placeholder="예: FastAPI RAG"><button>찾기</button></form>
          <div id="recommendations"></div>
        </div>
        <div class="block">
          <label for="chat-query" class="name">RAG 질문</label>
          <p class="analysis-note">분석 완료된 자막에서 근거 구간을 최대 3개 반환합니다. 최근 3턴의 대화 맥락이 유지됩니다.</p>
          <div class="controls"><span class="meta">근거</span><div class="segmented" role="group" aria-label="근거 표시 모드"><button type="button" id="mode-simple" class="active">기본</button><button type="button" id="mode-precise">문장 강조</button></div></div>
          <form id="chat-form"><input id="chat-query" placeholder="영상에서 RAG 구축 순서를 설명해줘"><button>질문</button></form>
          <div id="answer" class="chat-log"></div>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="/runtime-config.js"></script>
  <script>
    let selectedChannelId = null;
    let selectedVideo = null;
    let analysisEventSource = null;
    let analysisEventVideoId = null;
    let chatTurns = [];
    let chatHistoryCursor = null;
    let chatHistoryHasMore = false;
    let chatHistoryLoading = false;
    let evidenceMode = 'simple';
    const byId = (id) => document.getElementById(id);
    const esc = (text = '') => String(text).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const toast = (message) => { const el = byId('toast'); el.textContent = message; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 3200); };
    const chatApiOrigin = window.VIDEO_RAG_CHAT_ORIGIN || window.location.origin;
    async function api(path, options = {}) { const response = await fetch(path, { credentials:'same-origin', headers: {'Content-Type':'application/json'}, ...options }); if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(body.detail || '요청에 실패했습니다.'); } return response.status === 204 ? null : response.json(); }
    async function chatApi(path, options = {}) { const response = await fetch(`${chatApiOrigin}${path}`, { credentials:'include', headers: {'Content-Type':'application/json'}, ...options }); if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(body.detail || '질문 요청에 실패했습니다.'); } return response.json(); }
    async function streamChat(path, options, onEvent) {
      const response = await fetch(`${chatApiOrigin}${path}`, { credentials:'include', headers:{'Content-Type':'application/json','Accept':'text/event-stream'}, ...options });
      if (!response.ok || !response.body) { const body = await response.json().catch(() => ({})); throw new Error(body.detail || '질문 스트리밍 요청에 실패했습니다.'); }
      const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = '';
      const dispatch = (block) => { let event = 'message'; const data = []; for (const line of block.split('\n')) { if (line.startsWith('event:')) event = line.slice(6).trim(); if (line.startsWith('data:')) data.push(line.slice(5).trim()); } if (data.length) onEvent(event, JSON.parse(data.join('\n'))); };
      while (true) { const {done, value} = await reader.read(); buffer += decoder.decode(value || new Uint8Array(), {stream:!done}); let boundary; while ((boundary = buffer.indexOf('\n\n')) >= 0) { dispatch(buffer.slice(0, boundary)); buffer = buffer.slice(boundary + 2); } if (done) { if (buffer.trim()) dispatch(buffer); return; } }
    }
    let currentAudio = null;
    let currentTtsIndex = null;
    let currentAudioUrl = null;

    function stopAudio() {
      if (!currentAudioUrl) return;
      const url = currentAudioUrl;
      currentAudioUrl = null;
      currentAudio = null;
      currentTtsIndex = null;
      URL.revokeObjectURL(url);
      renderLog();
    }

    let ttsLoading = false;
    async function playAnswer(text, index) {
      if (ttsLoading) return;
      ttsLoading = true;
      stopAudio();
      try {
        const response = await fetch(`${chatApiOrigin}/tts`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (!response.ok) throw new Error('음성 생성에 실패했습니다.');
        currentAudioUrl = URL.createObjectURL(await response.blob());
        currentTtsIndex = index;
        renderLog();
      } finally {
        ttsLoading = false;
      }
    }
    const isAnalyzed = (status) => status === 'ready' || status === 'succeeded';
    const isAnalysisActive = (status) => status === 'queued' || status === 'running';
    const statusClass = (status) => isAnalyzed(status) ? 'ready' : status === 'failed' ? 'failed' : '';

    function closeAnalysisEvents() { if (analysisEventSource) analysisEventSource.close(); analysisEventSource = null; analysisEventVideoId = null; }
    function openAnalysisEvents(videoId) {
      if (analysisEventSource && analysisEventVideoId === videoId) return;
      closeAnalysisEvents(); analysisEventVideoId = videoId;
      const source = new EventSource(`/videos/${videoId}/events`);
      analysisEventSource = source;
      source.addEventListener('analysis_status', async (event) => {
        let update; try { update = JSON.parse(event.data); } catch (_) { return; }
        if (!selectedVideo || selectedVideo.id !== update.video_id) return;
        selectedVideo.analysis_status = update.status;
        selectedVideo.analysis_stage = update.progress.stage;
        selectedVideo.analysis_message = update.progress.message;
        selectedVideo.analysis_error = update.error;
        renderSelectedVideo();
        await loadVideos();
        if (update.status === 'succeeded' || update.status === 'failed') closeAnalysisEvents();
      });
      source.onerror = () => { /* EventSource reconnects using the server-provided retry value. */ };
    }
    function subscribeToSelectedVideoIfNeeded() { if (selectedVideo && isAnalysisActive(selectedVideo.analysis_status)) openAnalysisEvents(selectedVideo.id); else if (analysisEventVideoId) closeAnalysisEvents(); }

    async function loadChannels() {
      const channels = await api('/channels'); const container = byId('channels');
      if (!channels.length) { container.innerHTML = '<p class="empty">채널 URL을 등록한 뒤 새 영상 탐색을 실행하세요.</p>'; return; }
      container.innerHTML = channels.map(channel => `<button class="channel ${channel.id === selectedChannelId ? 'selected' : ''}" data-channel-id="${channel.id}"><span class="name">${esc(channel.name || channel.url)}</span><span class="meta">${channel.last_scanned_at ? '최근 탐색 완료' : '아직 탐색하지 않음'}</span></button>`).join('');
      container.querySelectorAll('[data-channel-id]').forEach(button => button.onclick = () => selectChannel(Number(button.dataset.channelId)));
      if (!selectedChannelId) await selectChannel(channels[0].id);
    }
    async function selectChannel(channelId) { selectedChannelId = channelId; selectedVideo = null; byId('scan-button').disabled = false; await loadChannels(); await loadVideos(); renderSelectedVideo(); }
    async function loadVideos() {
      if (!selectedChannelId) return; const videos = await api(`/channels/${selectedChannelId}/videos`); byId('video-count').textContent = `${videos.length}개`;
      if (selectedVideo) selectedVideo = videos.find(video => video.id === selectedVideo.id) || null;
      if (!selectedVideo) selectedVideo = videos.find(video => isAnalysisActive(video.analysis_status)) || null;
      byId('videos').innerHTML = videos.length ? videos.map(video => `<button class="video ${selectedVideo && video.id === selectedVideo.id ? 'selected' : ''}" data-video-id="${video.id}"><span class="name">${esc(video.title)}</span><span class="meta">${video.uploaded_at || '업로드일 미확인'} · <span class="tag ${statusClass(video.analysis_status)}">${esc(video.analysis_status)}</span></span></button>`).join('') : '<p class="empty">메타데이터가 없습니다. 새 영상 탐색을 실행하고 Worker가 끝날 때까지 기다리세요.</p>';
      byId('videos').querySelectorAll('[data-video-id]').forEach(button => { const video = videos.find(item => item.id === Number(button.dataset.videoId)); button.onclick = () => { selectedVideo = video; subscribeToSelectedVideoIfNeeded(); loadVideos(); renderSelectedVideo(); }; });
      subscribeToSelectedVideoIfNeeded();
    }
    function renderSelectedVideo() {
      const container = byId('selected-video'); if (!selectedVideo) { container.innerHTML = '<p class="empty">RAG로 분석할 영상을 선택하세요. 메타데이터 추천은 분석하지 않은 영상도 찾습니다.</p>'; return; }
      const error = selectedVideo.analysis_error ? `<p class="analysis-note">오류: ${esc(selectedVideo.analysis_error)}</p>` : '';
      const progress = selectedVideo.analysis_stage ? `<p class="analysis-note">진행: <strong>${esc(selectedVideo.analysis_stage)}</strong>${selectedVideo.analysis_message ? ` · ${esc(selectedVideo.analysis_message)}` : ''}</p>` : '';
      const disabled = isAnalyzed(selectedVideo.analysis_status) || isAnalysisActive(selectedVideo.analysis_status);
      const buttonLabel = selectedVideo.analysis_status === 'failed' ? '다시 분석 시작' : isAnalyzed(selectedVideo.analysis_status) ? '질문 가능' : '이 영상 분석 시작';
      container.innerHTML = `<div class="video-header"><span class="tag ${statusClass(selectedVideo.analysis_status)}">${esc(selectedVideo.analysis_status)}</span><p class="name">${esc(selectedVideo.title)}</p><a href="${esc(selectedVideo.url)}" target="_blank" rel="noreferrer">YouTube에서 열기</a>${progress}${error}<div class="controls"><button id="analyze-button" ${disabled ? 'disabled' : ''}>${buttonLabel}</button></div></div>`;
      const button = byId('analyze-button'); if (button) button.onclick = analyzeSelectedVideo;
    }
    function isMobilePlaybackContext() { return Boolean(navigator.userAgentData?.mobile) || /Android|iPhone|iPad|iPod|IEMobile|Opera Mini/i.test(navigator.userAgent); }
    function playbackUrl(rawUrl) {
      try {
        const source = new URL(rawUrl); const videoId = source.searchParams.get('v'); const timestamp = source.searchParams.get('t');
        if (!videoId || !/(^|\.)youtube\.com$/.test(source.hostname)) return rawUrl;
        const target = isMobilePlaybackContext() ? new URL(`https://youtu.be/${encodeURIComponent(videoId)}`) : new URL('https://www.youtube.com/watch');
        if (!isMobilePlaybackContext()) target.searchParams.set('v', videoId);
        if (timestamp) target.searchParams.set('t', timestamp);
        return target.toString();
      } catch (_) { return rawUrl; }
    }
    function evidenceHtml(evidence = []) { return evidence.map(item => `<div class="evidence"><a href="${esc(playbackUrl(item.url))}" target="_blank" rel="noreferrer">${esc(item.title)} · ${Math.floor(item.start_seconds / 60)}:${String(Math.floor(item.start_seconds % 60)).padStart(2,'0')}–${Math.floor(item.end_seconds / 60)}:${String(Math.floor(item.end_seconds % 60)).padStart(2,'0')}</a><br><span class="meta">${esc(item.quote)}</span></div>`).join(''); }
    function ttsButtonHtml(turn, index) {
      if (!turn.content.trim()) return '';
      if (currentTtsIndex === index && currentAudioUrl) {
        return `<div class="controls"><audio controls autoplay src="${currentAudioUrl}" data-tts-player="${index}" style="width:100%"></audio></div>`;
      }
      return `<div class="controls"><button class="secondary" data-tts-index="${index}">🔊 답변 듣기</button></div>`;
    }
    function renderLog() {
      const container = byId('answer');
      if (!chatTurns.length) { container.innerHTML = '<p class="empty">아직 대화 기록이 없습니다. 질문을 입력해 보세요.</p>'; return; }
      container.innerHTML = chatTurns.map((turn, index) => `<div class="msg ${turn.role}">${esc(turn.content)}</div>${turn.role === 'assistant' ? ttsButtonHtml(turn, index) + evidenceHtml(turn.evidence) : ''}`).join('');
      container.querySelectorAll('[data-tts-index]').forEach(button => {
        button.onclick = async () => {
          const index = Number(button.dataset.ttsIndex);
          button.disabled = true; button.textContent = '생성 중...';
          try { await playAnswer(chatTurns[index].content, index); }
          catch (error) { toast(error.message); button.disabled = false; button.textContent = '🔊 답변 듣기'; }
        };
      });
      container.querySelectorAll('[data-tts-player]').forEach(player => {
        player.playbackRate = 1.5;
        player.onplay = () => { player.playbackRate = 1.5; currentAudio = player; };
      });
      container.scrollTop = container.scrollHeight;
    function highlightedQuote(item) {
      const quote = String(item.quote || '');
      const highlight = item.highlight && item.highlight.text ? String(item.highlight.text) : '';
      const index = highlight ? quote.indexOf(highlight) : -1;
      if (index < 0) return esc(quote);
      return `${esc(quote.slice(0, index))}<span class="highlight">${esc(highlight)}</span>${esc(quote.slice(index + highlight.length))}`;
    }
    function evidenceHtml(evidence = []) {
      if (!evidence.length) return '';
      const rows = evidence.map(item => `<a class="evidence ${item.is_primary ? 'primary' : ''}" href="${esc(playbackUrl(item.url))}" target="_blank" rel="noreferrer"><span class="evidence-head"><span class="evidence-time">${Math.floor(item.start_seconds / 60)}:${String(Math.floor(item.start_seconds % 60)).padStart(2,'0')}–${Math.floor(item.end_seconds / 60)}:${String(Math.floor(item.end_seconds % 60)).padStart(2,'0')}</span>${item.is_primary ? '<span class="badge">주요</span>' : ''}<span class="evidence-source">${esc(item.title)}</span></span><span class="evidence-quote">${highlightedQuote(item)}</span></a>`).join('');
      return `<div class="evidence-list"><p class="evidence-title">참고 구간</p>${rows}</div>`;
    }
    function renderLog(stickToBottom = true) {
      const container = byId('answer');
      if (!chatTurns.length) { container.innerHTML = '<p class="empty">아직 대화 기록이 없습니다. 질문을 입력해 보세요.</p>'; return; }
      container.innerHTML = chatTurns.map(turn => `<div class="msg ${turn.role}">${esc(turn.content)}</div>${turn.role === 'assistant' ? evidenceHtml(turn.evidence) : ''}`).join('');
      if (stickToBottom) container.scrollTop = container.scrollHeight;
    }
    const chatTurnFromMessage = (message) => ({id: message.id, role: message.role, content: message.content, evidence: Array.isArray(message.evidence) ? message.evidence : []});
    async function loadChatHistory({beforeId = null, prepend = false} = {}) {
      if (chatHistoryLoading) return;
      chatHistoryLoading = true;
      const container = byId('answer');
      const previousHeight = container.scrollHeight;
      try {
        const params = new URLSearchParams({limit: '20'});
        if (beforeId) params.set('before_id', beforeId);
        const history = await chatApi(`/chat/history?${params.toString()}`);
        const messages = history.items || history.messages || [];
        const turns = messages.map(chatTurnFromMessage);
        chatHistoryCursor = history.next_cursor || null;
        chatHistoryHasMore = Boolean(history.has_more);
        chatTurns = prepend ? turns.concat(chatTurns) : turns;
        renderLog(!prepend);
        if (prepend) container.scrollTop = container.scrollHeight - previousHeight;
      }
      catch (_) { if (!prepend) chatTurns = []; }
      finally { chatHistoryLoading = false; }
      if (!prepend) renderLog();
    }
    async function analyzeSelectedVideo() { try { const result = await api(`/videos/${selectedVideo.id}/analyze`, {method:'POST'}); toast(`분석 작업 ${result.job_id}번을 등록했습니다. Worker가 처리합니다.`); selectedVideo.analysis_status = 'queued'; selectedVideo.analysis_stage = 'queued'; selectedVideo.analysis_message = '분석 작업을 기다리고 있습니다.'; selectedVideo.analysis_error = null; renderSelectedVideo(); openAnalysisEvents(selectedVideo.id); await loadVideos(); } catch (error) { toast(error.message); } }
    byId('channel-form').onsubmit = async (event) => { event.preventDefault(); try { const channel = await api('/channels', {method:'POST', body:JSON.stringify({url:byId('channel-url').value})}); byId('channel-url').value = ''; selectedChannelId = channel.id; toast('채널을 등록했습니다. 새 영상 탐색을 실행하세요.'); await loadChannels(); } catch (error) { toast(error.message); } };
    byId('scan-button').onclick = async () => { try { const result = await api(`/channels/${selectedChannelId}/scan`, {method:'POST'}); toast(`메타데이터 탐색 작업 ${result.job_id}번을 등록했습니다.`); } catch (error) { toast(error.message); } };
    byId('recommendation-form').onsubmit = async (event) => { event.preventDefault(); try { const result = await api('/recommendations', {method:'POST', body:JSON.stringify({query:byId('recommendation-query').value})}); byId('recommendations').innerHTML = result.items.length ? result.items.map(item => `<a class="result" href="${esc(item.url)}" target="_blank" rel="noreferrer"><span class="name">${esc(item.title)} <span class="score">${item.score}</span></span><span class="meta">${esc(item.basis)}</span></a>`).join('') : '<p class="empty">추천할 메타데이터가 없습니다.</p>'; } catch (error) { toast(error.message); } };
    byId('chat-form').onsubmit = async (event) => {
      event.preventDefault();
      const form = event.currentTarget; const button = form.querySelector('button');
      const query = byId('chat-query').value; if (!query.trim()) return;
      button.disabled = true; byId('chat-query').value = '';
      chatTurns.push({role:'user', content:query});
      const assistantTurn = {role:'assistant', content:'', evidence:[]};
      chatTurns.push(assistantTurn);
      renderLog();
      try {
        await streamChat('/chat/stream', {method:'POST', body:JSON.stringify({query, video_id: selectedVideo ? selectedVideo.id : null, evidence_mode: evidenceMode})}, (type, data) => {
          if (type === 'evidence') assistantTurn.evidence = data.evidence || [];
          if (type === 'token') { assistantTurn.content = data.text || ''; renderLog(); }
          if (type === 'done') { assistantTurn.evidence = data.evidence || assistantTurn.evidence; renderLog(); }
          if (type === 'error') throw new Error(data.message || 'Chat 응답 생성에 실패했습니다.');
        });
      } catch (error) {
        if (!assistantTurn.content) chatTurns.pop();
        renderLog();
        toast(error.message);
      } finally { button.disabled = false; }
    };
    byId('answer').addEventListener('scroll', () => {
      if (byId('answer').scrollTop <= 24 && chatHistoryHasMore && chatHistoryCursor && !chatHistoryLoading) {
        loadChatHistory({beforeId: chatHistoryCursor, prepend: true});
      }
    });
    function setEvidenceMode(mode) {
      evidenceMode = mode;
      byId('mode-simple').classList.toggle('active', mode === 'simple');
      byId('mode-precise').classList.toggle('active', mode === 'precise');
    }
    byId('mode-simple').onclick = () => setEvidenceMode('simple');
    byId('mode-precise').onclick = () => setEvidenceMode('precise');
    async function loadWorkspace() { const workspace = await api('/auth/me'); byId('workspace-code').textContent = `작업공간 코드: ${workspace.workspace_code}`; }
    byId('connect-workspace').onclick = async () => { const code = window.prompt('기존 작업공간 코드를 입력하세요.'); if (!code) return; try { const workspace = await api('/auth/workspace', {method:'POST', body:JSON.stringify({workspace_code:code})}); closeAnalysisEvents(); selectedChannelId = null; selectedVideo = null; byId('workspace-code').textContent = `작업공간 코드: ${workspace.workspace_code}`; await loadChannels(); await loadChatHistory(); toast('기존 작업공간에 연결했습니다.'); } catch (error) { toast(error.message); } };
    byId('new-workspace').onclick = async () => { if (!window.confirm('새 작업공간으로 전환할까요? 현재 작업공간은 코드로 다시 연결할 수 있습니다.')) return; const workspace = await api('/auth/new-workspace', {method:'POST'}); closeAnalysisEvents(); selectedChannelId = null; selectedVideo = null; byId('workspace-code').textContent = `작업공간 코드: ${workspace.workspace_code}`; await loadChannels(); await loadChatHistory(); toast('새 작업공간을 만들었습니다.'); };
    api('/health').then(async () => { byId('server-status').textContent = '로컬 서버 연결됨'; await loadWorkspace(); await loadChannels(); await loadChatHistory(); }).catch(() => { byId('server-status').textContent = '서버 연결 실패'; });
  </script>
</body>
</html>
